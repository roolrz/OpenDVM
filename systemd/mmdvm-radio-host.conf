[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/sbin/opendvm-radio-host
ExecReload=/bin/kill -HUP $MAINPID
RuntimeDirectory=opendvm-host
RuntimeDirectoryMode=0755
# Let the supervisor signal and reap its children. systemd still kills the
# entire control group if graceful shutdown exceeds the deadline.
KillMode=mixed
# Allow an in-progress hotplug cleanup followed by remaining child shutdown.
TimeoutStopSec=45
